<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text { font-family: Helvetica, Arial, sans-serif; fill: #111; letter-spacing: 1px; }
      .subtle { fill: #666; font-family: Helvetica, Arial, sans-serif; }
      .line { stroke: #111; stroke-width: 2; }
    </style>
  </defs>

  <!-- Mark container -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="140" height="140" fill="none" class="line"></rect>

    <!-- Financial bars (kept unchanged, grid aligned) -->
    <line x1="35" y1="110" x2="35" y2="60" class="line"></line>
    <line x1="70" y1="110" x2="70" y2="40" class="line"></line>
    <line x1="105" y1="110" x2="105" y2="25" class="line"></line>

    <!-- PERFECTLY CENTERED SYSTEM -->
    <!-- Define center axis at x = 70 -->
    <text x="45" y="30" font-size="18" class="subtle" text-anchor="middle">B</text>
    <text x="70" y="32" font-size="22" class="text" text-anchor="middle">+</text>
    <text x="95" y="30" font-size="18" class="subtle" text-anchor="middle">T</text>
  </g>

  <!-- Wordmark -->
  <text x="220" y="105" font-size="52" class="text" font-weight="500">
    B+T Oehninger
  </text>

  <!-- Descriptor -->
  <text x="222" y="145" font-size="20" class="subtle">
    Buchhaltung &amp; Treuhand
  </text>

  <!-- Swiss rule line -->
  <line x1="220" y1="120" x2="820" y2="120" class="line" opacity="0.2"></line>
</svg>