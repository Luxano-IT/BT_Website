<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark {
        font-family: Helvetica, Arial, sans-serif;
        fill: #111;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .subtle {
        fill: #666;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 20px;
        letter-spacing: 0.5px;
      }

      .line {
        stroke: #111;
        stroke-width: 2;
      }
    </style>
  </defs>

  <!-- ICON -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="140" height="140" fill="none" class="line"></rect>

    <!-- Financial bars -->
    <line x1="35" y1="110" x2="35" y2="60" class="line"></line>
    <line x1="70" y1="110" x2="70" y2="40" class="line"></line>
    <line x1="105" y1="110" x2="105" y2="25" class="line"></line>

    <!-- B + T system (centered, unchanged logic) -->
    <text x="45" y="32" text-anchor="middle" class="subtle">B</text>
    <text x="70" y="34" text-anchor="middle" font-size="22" fill="#111" font-family="Helvetica, Arial, sans-serif">+</text>
    <text x="95" y="32" text-anchor="middle" class="subtle">T</text>
  </g>

  <!-- WORDMARK (made dominant for web readability) -->
  <text x="220" y="95" class="wordmark">
    B+T Oehninger
  </text>

  <!-- TAGLINE -->
  <text x="222" y="140" class="subtle">
    Buchhaltung &amp; Treuhand
  </text>

  <!-- subtle Swiss alignment rule -->
  <line x1="220" y1="110" x2="820" y2="110" class="line" opacity="0.15"></line>
</svg>